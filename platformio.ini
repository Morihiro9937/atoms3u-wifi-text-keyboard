[platformio]
default_envs = phase_e

[env]
platform = espressif32@6.12.0
board = m5stack-atoms3
framework = arduino
upload_protocol = esptool
upload_speed = 460800

; The PlatformIO AtomS3 definition defaults to the ESP32-S3 hardware
; USB-Serial/JTAG controller. HID needs the USB-OTG (TinyUSB) controller.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Runtime USB policy for this product: keyboard HID only.
; Do not enable CDC, MSC, or DFU in the application image.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

[env:phase_a]
build_src_filter =
    -<*>
    +<main.cpp>

[env:phase_b]
build_src_filter =
    -<*>
    +<phase_b.cpp>

[env:phase_c]
build_src_filter =
    -<*>
    +<phase_c.cpp>

[env:phase_d]
build_src_filter =
    -<*>
    +<phase_d.cpp>

[env:phase_e]
build_src_filter =
    -<*>
    +<phase_e.cpp>
extra_scripts =
    pre:scripts/generate_gbk_table.py
    pre:scripts/generate_web_assets.py

; Earlier isolated prototype retained for reference. The current candidate
; integrates the experimental modes into phase_e; phase_e remains the default.
[env:alt_test]
build_src_filter =
    -<*>
    +<alt_test.cpp>
extra_scripts = pre:scripts/generate_gbk_table.py
